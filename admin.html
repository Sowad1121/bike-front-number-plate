<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Bike Front Number Plate</title><style>
*{box-sizing:border-box}body{background:#0b0c10;color:#f4f4f5;font:16px system-ui,sans-serif;margin:0}main{max-width:1080px;margin:45px auto;padding:0 18px}h1{font-size:clamp(25px,4vw,40px)}.panel{background:#181a20;border:1px solid #353842;border-radius:16px;padding:22px;margin:20px 0}input,select,button{padding:12px;border-radius:9px;font:inherit}input,select{background:#0d0e13;border:1px solid #515460;color:white;width:100%;margin:6px 0 12px}button{background:#f03542;border:0;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#e6e6e8}.hide{display:none}.card{background:#101216;border:1px solid #3b3d45;border-radius:12px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.muted{color:#b5b8c1} .flex{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}small{color:#b5b8c1}#msg{white-space:pre-wrap}</style>
<script src="/firebase-config.js"></script></head><body><main><div class="flex"><h1>🔐 Admin Dashboard</h1><a href="/">← Homepage</a></div><p class="muted">Only authorized admins can view customer details. Payments require manual bKash verification.</p>
<section class="panel" id="login"><h2>Admin Login</h2><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Sign In</button></form></section>
<section class="panel hide" id="dashboard"><div class="flex"><h2>Orders</h2><div><button id="reload">Refresh</button> <button id="logout">Log out</button></div></div><p class="muted">Latest 100 orders. Verify bKash transaction, sender and amount ৳165 in your own bKash records before approving.</p><div id="orders"></div></section><p id="msg" role="status"></p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const $=id=>document.getElementById(id), msg=$('msg');
if(!window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey.startsWith('REPLACE')) msg.textContent='Setup needed: configure firebase-config.js first.';
const app=initializeApp(window.FIREBASE_CONFIG),auth=getAuth(app);
function say(s){msg.textContent=s}
async function request(method,body){const u=auth.currentUser;if(!u)throw Error('Sign in first');const token=await u.getIdToken();const r=await fetch('/.netlify/functions/admin',{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const statuses=['new','processing','shipped','delivered','cancelled'];
function node(tag,content,cls){const el=document.createElement(tag);if(content!==undefined)el.textContent=content;if(cls)el.className=cls;return el}
async function load(){say('Loading...');try{const d=await request('GET');$('orders').replaceChildren();for(const o of d.orders){const card=node('div',undefined,'card');const heading=node('h3',`Order ${o.id} — ${o.full_name||''}`);card.append(heading);for(const [label,key] of [['Mobile','mobile'],['Alternate','alternative_mobile'],['Address','delivery_address'],['Registration','registration_number'],['Bike','brand_model'],['Year','manufacture_year'],['bKash sender','bkash_sender'],['Transaction ID','transaction_id']])card.append(node('p',label+': '+(o[key]||'—')));card.append(node('p','Price ৳550 | Advance ৳165 | Due ৳385 | Delivery estimate: 4–7 working days after confirmation'));
const grid=node('div',undefined,'grid');const payBox=node('div');payBox.append(node('label','Payment status'));const pay=node('select');for(const p of ['pending','verified','rejected']){const opt=node('option',p);opt.value=p;pay.append(opt)}pay.value=o.payment_status||'pending';payBox.append(pay);grid.append(payBox);const statusBox=node('div');statusBox.append(node('label','Order status'));const status=node('select');for(const s of statuses){const opt=node('option',s);opt.value=s;status.append(opt)}status.value=o.order_status||'new';statusBox.append(status);grid.append(statusBox);card.append(grid);
const save=node('button','Save changes');save.addEventListener('click',async()=>{if(pay.value==='verified' && o.payment_status!=='verified' && !confirm('Have you independently verified the ৳165 bKash payment in your bKash account?'))return;save.disabled=true;try{await request('POST',{id:o.id,payment_status:pay.value,order_status:status.value});say('Order updated');await load()}catch(e){say(e.message)}finally{save.disabled=false}});card.append(save);$('orders').append(card)}if(!d.orders.length)$('orders').append(node('p','No orders yet'));say('Loaded '+d.orders.length+' orders')}catch(e){say(e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();say('Signing in...');try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){say('Login failed. Check credentials and admin authorization.')}});
$('logout').onclick=()=>signOut(auth);$('reload').onclick=load;
onAuthStateChanged(auth,async u=>{$('login').classList.toggle('hide',!!u);$('dashboard').classList.toggle('hide',!u);if(u)await load();else say('')});
</script></body></html>
